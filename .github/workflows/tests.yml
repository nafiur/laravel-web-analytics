name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            connection: sqlite
            label: PHP 8.2 / SQLite
          - php: '8.3'
            connection: sqlite
            label: PHP 8.3 / SQLite
          - php: '8.4'
            connection: sqlite
            label: PHP 8.4 / SQLite
          - php: '8.5'
            connection: sqlite
            label: PHP 8.5 / SQLite
          - php: '8.4'
            connection: mysql
            label: PHP 8.4 / MySQL 8
          - php: '8.4'
            connection: pgsql
            label: PHP 8.4 / PostgreSQL 16

    name: ${{ matrix.label }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: lwa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lwa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Run test suite
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.connection == 'mysql' && '3306' || (matrix.connection == 'pgsql' && '5432' || '') }}
          DB_DATABASE: ${{ matrix.connection == 'sqlite' && ':memory:' || 'lwa_test' }}
          DB_USERNAME: ${{ matrix.connection == 'pgsql' && 'postgres' || 'root' }}
          DB_PASSWORD: ${{ matrix.connection == 'sqlite' && '' || 'password' }}
        run: vendor/bin/phpunit

  legacy-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1 (legacy v2 syntax check)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP files
        run: find src config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
